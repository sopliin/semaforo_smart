<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Consulta de evidencias - Admin</title>
<!--	<link rel="preconnect" href="https://fonts.gstatic.com">-->
	<link rel="shortcut icon" href="img/icons/jagar.png" />
    <link href="css/app.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<!--	<link rel="canonical" href="https://demo-basic.adminkit.io/" />-->
</head>
<body>
  <div class="wrapper">
    <nav id="sidebar" class="sidebar js-sidebar">
        <div class="sidebar-content js-simplebar">
            <a class="sidebar-brand" href="/evidencias">
                <span class="align-middle">Semáforo Smart</span>
            </a>
            <ul class="sidebar-nav">
                <li class="sidebar-item active">
                    <a class="sidebar-link" href="/evidencias">
                        <i class="align-middle" data-feather="sliders"></i> <span class="align-middle">Evidencias</span>
                    </a>
                </li>
                <li class="sidebar-item">
                    <a class="sidebar-link" href="/gestion">
                        <i class="align-middle" data-feather="settings"></i> <span class="align-middle">Gestión Semafórica</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
    <main class="content">
        <div class="container-fluid p-0">
            <div class="d-flex align-items-center mb-3">
                <h1 class="h3 mb-0 flex-grow-1">Consulta de evidencias</h1>
                <span class="badge bg-primary">Administración</span>
            </div>
            <div class="card mb-4">
                <div class="card-header">
                    <h5 class="card-title mb-0">Filtros</h5>
                </div>
                <div class="card-body">
                    <form class="row gy-3 gx-3 align-items-end" method="get" th:action="@{/evidencias}">
                        <div class="col-sm-6 col-md-3">
                            <label class="form-label">Fecha desde</label>
                            <input type="date" name="desde" class="form-control" th:value="${fechaDesde}">
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <label class="form-label">Fecha hasta</label>
                            <input type="date" name="hasta" class="form-control" th:value="${fechaHasta}">
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <label class="form-label">Placa</label>
                            <input type="text" name="placa" class="form-control" placeholder="ABC123" th:value="${placa}">
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <label class="form-label">Tipo de infracción</label>
                            <input type="text" name="tipo" class="form-control" placeholder="Ej: luz roja" th:value="${tipo}">
                        </div>
                        <div class="col-sm-6 col-md-3">
                            <label class="form-label">Sitio</label>
                            <select class="form-select" name="sitioId">
                                <option th:value="" th:selected="${sitioId == null}">Todos</option>
                                <option th:each="sitio : ${sitios}" th:value="${sitio.id}" th:selected="${sitio.id == sitioId}" th:text="${sitio.nombre}"></option>
                            </select>
                        </div>
                        <div class="col-sm-12 col-md-6 d-flex gap-2">
                            <button class="btn btn-primary" type="submit">Aplicar</button>
                            <a class="btn btn-outline-secondary" href="/evidencias">Limpiar</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Evidencias registradas</h5>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(infracciones)}" class="text-muted">No hay resultados para los filtros seleccionados.</div>
                    <div class="table-responsive" th:if="${!#lists.isEmpty(infracciones)}">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Placa</th>
                                    <th>Tipo</th>
                                    <th>Sitio</th>
                                    <th>Velocidad (km/h)</th>
                                    <th>Estado de luz</th>
                                    <th>Imagen</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="inf : ${infracciones}">
                                    <td th:text="${inf.createdat}"></td>
                                    <td th:text="${inf.placa}"></td>
                                    <td><span class="badge bg-warning text-dark" th:text="${inf.tipo}"></span></td>
                                    <td th:text="${inf.sitio != null ? inf.sitio.nombre : 'N/D'}"></td>
                                    <td th:text="${inf.velocidadkmh}"></td>
                                    <td th:text="${inf.lightstate}"></td>
                                    <td>
                                        <img th:if="${inf.fotoprocesada != null}" th:src="${inf.fotoprocesada}" class="img-fluid rounded" style="max-width: 110px" alt="Evidencia">
                                        <span th:if="${inf.fotoprocesada == null}" class="text-muted">Sin imagen</span>
                                    </td>
                                    <td class="text-end">
                                        <a class="btn btn-sm btn-outline-primary" th:href="${inf.fotoprocesada}" target="_blank" th:if="${inf.fotoprocesada != null}">Descargar</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
      <footer class="footer">
          <div class="container-fluid">
              <div class="row text-muted">
                  <div class="col-12 text-start">
                      <p class="mb-0">&copy; 2025 Semáforo Smart</p>
                  </div>
              </div>
          </div>
      </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
